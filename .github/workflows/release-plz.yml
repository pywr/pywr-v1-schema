name: Release-plz

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

jobs:

  # Release unpublished packages.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # Attach the JSON Schemas generated by this release to its GitHub release, so that they have
      # a stable, versioned URL.
      - name: Generate the JSON Schemas
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        run: |
          cargo run --locked --release -p pywr-v1-validator -- export-schema pywr-v1-model.schema.json --kind model
          cargo run --locked --release -p pywr-v1-validator -- export-schema pywr-v1-multi-model.schema.json --kind multi-model
      - name: Upload the JSON Schemas to the release
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=$(jq -r '.[] | select(.package_name == "pywr-v1-schema") | .tag' <<< "$RELEASES")
          if [ -z "$tag" ]; then
            echo "::warning::This release does not include pywr-v1-schema, so the JSON Schemas are not attached."
            exit 0
          fi
          gh release upload "$tag" pywr-v1-model.schema.json pywr-v1-multi-model.schema.json

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}